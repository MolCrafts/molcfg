name: release

# A v* tag re-runs test.yml (hooks, docs, tests, workflow policy) on the tagged
# tree, checks the tag against pyproject.toml, builds, and publishes to PyPI
# (trusted publishing, MolCrafts only). workflow_dispatch is the dry run:
# everything but the upload.
'on':
  push:
    tags:
    - v*
  workflow_dispatch: null

permissions:
  contents: read

# One group per file, workflow, event and ref; a release is never cancelled.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    permissions:
      contents: read
    name: release
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  test:
    name: release / test
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    uses: ./.github/workflows/test.yml

  build:
    name: release / build
    needs: [context, test]
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv version --short)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: release / pypi
    needs: [context, build]
    # A `v*` tag on MolCrafts, and nothing else: the context workflow decides.
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
