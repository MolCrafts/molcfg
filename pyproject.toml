[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molcrafts-molcfg"
version = "1.5.1"
description = "Configuration library for the molcrafts ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Roy Kid" }
]
keywords = ["config", "configuration", "environment", "validation", "merge"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/MolCrafts/molcfg"
Documentation = "https://docs.molcrafts.org/molcfg/"
Repository = "https://github.com/MolCrafts/molcfg"
Issues = "https://github.com/MolCrafts/molcfg/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11",
  "tox>=4.23",
]
docs = ["zensical>=0.0.53", "molcrafts-zensical-theme>=0.2.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["molcfg*"]

[tool.setuptools.package-data]
molcfg = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# PLW1514 (a preview rule; explicit-preview-rules keeps every other preview
# rule off): text-mode file I/O names its encoding. Unnamed, Python decodes
# with the locale -- cp1252 on Windows -- so a read that passes every Linux
# hook fails only on CI's Windows leg.
select = ["E", "F", "I", "PLW1514"]
preview = true
explicit-preview-rules = true

# Isolated gates — prek + CI: uv run --extra dev tox -e lint|py
[tool.tox]
requires = ["tox>=4.23"]
env_list = ["lint", "py"]

[tool.tox.env.lint]
description = "CI lint"
skip_install = true
base_python = ["python3.12"]
deps = [
  "ruff>=0.11",
  "pytest>=8.0",
]
commands = [
  ["ruff", "check", "."],
]

[tool.tox.env.py]
description = "CI test (non-editable package when package=wheel)"
base_python = ["python3.12"]
pass_env = [
  "HOME",
  "PATH",
  "SSH_AUTH_SOCK",
  "TERM",
  "VIRTUAL_ENV",
  "UV_*",
]
package = "wheel"
extras = ["dev"]
commands_pre = [
  [
    "{envpython}",
    "-c",
    "import pathlib, site; sps=site.getsitepackages(); print('site-packages', sps)",
  ],
]
commands = [
  ["{envpython}", "-m", "pytest", "-q"],
]

# uv caches an editable build of this checkout by these keys. The default,
# pyproject.toml alone, would keep handing a wheel from an older commit to
# a partner that builds molcfg from a checkout (molpy).
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]
